{% extends 'base.html' %}

{% block title %}稽核紀錄 | 台南大學實驗室監控系統{% endblock %}

{% block content %}
<section class="glass-panel panel-block">
  <h1>稽核紀錄</h1>
  {% if audits %}
    <ul class="list-block">
      {% for audit in audits %}
        <li>
          <strong>{{ audit.action }}</strong>
          <span>{{ audit.details }}</span>
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p>目前尚未有稽核紀錄。</p>
  {% endif %}
</section>
{% endblock %}
