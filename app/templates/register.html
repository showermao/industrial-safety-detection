{% extends 'base.html' %}

{% block title %}註冊 | 台南大學實驗室監控系統{% endblock %}

{% block content %}
<section class="auth-card glass-panel">
  <h1>註冊帳號</h1>
  <form method="post">
    <label>
      使用者名稱
      <input type="text" name="username" required>
    </label>
    <label>
      電子郵件
      <input type="email" name="email" required>
    </label>
    <label>
      密碼
      <input type="password" name="password" required>
    </label>
    <label>
      角色
      <select name="role">
        <option value="user">一般使用者</option>
        <option value="admin">管理者</option>
      </select>
    </label>
    <button type="submit">送出註冊</button>
  </form>
  <p class="helper-text">已有帳號？<a href="{{ url_for('web.login') }}">返回登入</a></p>
</section>
{% endblock %}
